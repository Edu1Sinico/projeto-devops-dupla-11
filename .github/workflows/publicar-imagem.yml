
name: Publicar site com status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências e executar testes
        run: |
          pip install -r app/requirements.txt
          cd app
          python -m pytest -q

      - name: Gerar página de status
        run: |
          mkdir -p site

          cat > site/status.html <<EOF
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <title>Status</title>
          </head>
          <body>
            <h1>Status da aplicação</h1>
            <ul>
              <li>Commit: ${GITHUB_SHA::7}</li>
              <li>Publicado em: $(date -u '+%d/%m/%Y %H:%M UTC')</li>
              <li>Testes: aprovados</li>
            </ul>
          </body>
          </html>
          EOF

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

