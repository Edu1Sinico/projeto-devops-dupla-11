
name: Publicar site com status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências e executar testes
        run: |
          pip install -r app/requirements.txt
          cd app
          python -m pytest -q

      - name: Gerar página de status
        run: |
          mkdir -p site

          cat > site/status.html <<EOF
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <title>Status</title>
          </head>
          <body>
            <h1>Status da aplicação</h1>
            <ul>
              <li>Commit: ${GITHUB_SHA::7}</li>
              <li>Publicado em: $(date -u '+%d/%m/%Y %H:%M UTC')</li>
              <li>Testes: aprovados</li>
            </ul>
          </body>
          </html>
          EOF

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Verificar disponibilidade do artefato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..10}; do
            echo "Verificando artefato - tentativa $i"

            ARTIFACT=$(gh api \
              repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' \
              | head -n 1)

            if [ -n "$ARTIFACT" ]; then
              echo "Artefato encontrado: $ARTIFACT"
              exit 0
            fi

            sleep 3
          done

          echo "ERRO: artefato não encontrado pela API."
          exit 1

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

